apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mumble-data
  namespace: telephony
  labels:
    app.kubernetes.io/name: mumble
    app.kubernetes.io/part-of: spruik
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mumble
  namespace: telephony
  labels:
    app.kubernetes.io/name: mumble
    app.kubernetes.io/part-of: spruik
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mumble
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mumble
        app.kubernetes.io/part-of: spruik
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 15
      containers:
        - name: mumble
          image: mumblevoip/mumble-server:v1.5.915-1
          imagePullPolicy: IfNotPresent
          env:
            - name: MUMBLE_CONFIG_USERS
              value: "10"
            - name: MUMBLE_CONFIG_BANDWIDTH
              value: "128000"
            - name: MUMBLE_CONFIG_WELCOME_TEXT
              value: "Gain Engineering private phone audio"
            - name: MUMBLE_CONFIG_SEND_VERSION
              value: "false"
          ports:
            - name: mumble-tcp
              containerPort: 64738
              protocol: TCP
            - name: mumble-udp
              containerPort: 64738
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mumble-data
        - name: secrets
          secret:
            secretName: mumble-secrets
            items:
              - key: server-password
                path: MUMBLE_CONFIG_SERVER_PASSWORD
              - key: superuser-password
                path: MUMBLE_SUPERUSER_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: mumble
  namespace: telephony
  labels:
    app.kubernetes.io/name: mumble
    app.kubernetes.io/part-of: spruik
spec:
  selector:
    app.kubernetes.io/name: mumble
  ports:
    - name: mumble-tcp
      port: 64738
      targetPort: mumble-tcp
      protocol: TCP
    - name: mumble-udp
      port: 64738
      targetPort: mumble-udp
      protocol: UDP
