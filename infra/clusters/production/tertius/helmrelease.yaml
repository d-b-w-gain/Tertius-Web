apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tertius
  namespace: tertius
spec:
  interval: 5m
  timeout: 15m
  releaseName: tertius
  targetNamespace: tertius
  valuesFrom:
    - kind: Secret
      name: tertius-production-values
      valuesKey: values.yaml
  values:
    # The GIS image is promoted atomically with the other Tertius images. Keep
    # production enablement in Git so a missing external override cannot leave
    # the Site workbench deployed without its cache service.
    gisCache:
      enabled: true
  chart:
    spec:
      chart: ./infra/charts/tertius
      sourceRef:
        kind: GitRepository
        name: tertius-web
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
