name: Production Smoke

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'infra/charts/**'
      - 'infra/clusters/production/**'
      - 'scripts/smoke-production.sh'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  public-site:
    name: Public site is healthy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_URL: https://tertius.gainengineering.com.au
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The UI version grace period reads the promotion commit's age.
          fetch-depth: 50

      - name: Wait for production and run smoke checks
        shell: bash
        env:
          # Pushes may need to wait for Flux's five-minute reconciliation loop.
          SMOKE_ATTEMPTS: ${{ github.event_name == 'push' && '60' || '3' }}
          SMOKE_RETRY_DELAY_SECONDS: ${{ github.event_name == 'push' && '15' || '10' }}
          SMOKE_INITIAL_DELAY_SECONDS: ${{ github.event_name == 'push' && '300' || '0' }}
          # Pushes retry until the promoted UI is live. A scheduled run that
          # lands mid-rollout only warns for the first 30 minutes after a
          # promotion; after that a stale UI means deploys have stopped.
          SMOKE_VERSION_GRACE_SECONDS: ${{ github.event_name == 'push' && '0' || '1800' }}
        run: bash ./scripts/smoke-production.sh "$PRODUCTION_URL"
